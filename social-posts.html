<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Warm Care — Social Post Concepts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="social-posts.css" />
</head>
<body>
  <header class="page-hero">
    <p class="eyebrow"><a href="index.html">← Brand colours</a></p>
    <h1>Warm Care</h1>
    <p class="lede">Potential social posts using Soft Cream, Soft Caramel, Smile Burgundy, and Liver Gold.</p>
  </header>

  <main class="gallery">
    <!-- 1 Doctor intro -->
    <figure class="card">
      <div class="post post-doctor" role="img" aria-label="Doctor introduction social post">
        <div class="post-glow" aria-hidden="true"></div>
        <div class="doctor-block">
          <div class="doctor-photo" aria-hidden="true">
            <div class="face"></div>
            <div class="tie"></div>
          </div>
          <div class="digestive" aria-hidden="true"></div>
        </div>
        <div class="post-footer">
          <p class="kicker">Gastroenterology &amp; Hepatology</p>
          <h2>Dr Warm Care</h2>
          <p class="sub">Stomach &amp; liver care with a smile you can trust.</p>
        </div>
      </div>
      <figcaption>
        <strong>Meet the doctor</strong>
        Soft Cream canvas · burgundy name · Liver Gold organ glow
      </figcaption>
    </figure>

    <!-- 2 Habits / liver tip -->
    <figure class="card">
      <div class="post post-habits" role="img" aria-label="Habits and liver tip social post">
        <p class="kicker">Health tip</p>
        <h2>Your <span>habits</span><br />show on your liver.</h2>
        <div class="scene" aria-hidden="true">
          <div class="chair"></div>
          <div class="ottoman"></div>
          <div class="liver-char">
            <span class="arm left"></span>
            <span class="arm right"></span>
            <span class="leg left"></span>
            <span class="leg right"></span>
          </div>
        </div>
        <p class="cta-pill">Small changes · lasting care</p>
      </div>
      <figcaption>
        <strong>Educational tip</strong>
        Cream background · caramel furniture · gold liver character
      </figcaption>
    </figure>

    <!-- 3 Quote / smile -->
    <figure class="card">
      <div class="post post-quote" role="img" aria-label="Warm smile quote social post">
        <p class="quote-mark" aria-hidden="true">“</p>
        <h2>Good care starts with a warm hello.</h2>
        <p class="sub">At Warm Care, every visit is meant to feel human — calm, clear, and kind.</p>
        <div class="quote-bar" aria-hidden="true"></div>
        <p class="brand-lock">Warm Care</p>
      </div>
      <figcaption>
        <strong>Brand quote</strong>
        Burgundy typography on cream · caramel underline accent
      </figcaption>
    </figure>

    <!-- 4 Appointment CTA -->
    <figure class="card">
      <div class="post post-cta" role="img" aria-label="Book appointment social post">
        <p class="kicker">Book a visit</p>
        <h2>Ready for clearer answers about your gut &amp; liver?</h2>
        <ul class="checklist">
          <li>Same-week consults</li>
          <li>Gentle, thorough reviews</li>
          <li>Care that listens first</li>
        </ul>
        <div class="cta-block">
          <span class="cta-btn">Make an appointment</span>
        </div>
      </div>
      <figcaption>
        <strong>Call to action</strong>
        Cream field · caramel list markers · burgundy button (10%)
      </figcaption>
    </figure>

    <!-- 5 Myth vs fact -->
    <figure class="card">
      <div class="post post-myth" role="img" aria-label="Myth versus fact social post">
        <p class="kicker">Myth vs fact</p>
        <div class="split">
          <div class="panel myth">
            <p class="panel-label">Myth</p>
            <p>Liver issues only happen to heavy drinkers.</p>
          </div>
          <div class="panel fact">
            <p class="panel-label">Fact</p>
            <p>Diet, sleep, meds, and stress can all shape liver health.</p>
          </div>
        </div>
        <p class="footer-note">Ask us what your habits might be saying.</p>
      </div>
      <figcaption>
        <strong>Myth vs fact</strong>
        Caramel myth panel · burgundy fact panel · cream frame
      </figcaption>
    </figure>

    <!-- 6 Service spotlight -->
    <figure class="card">
      <div class="post post-service" role="img" aria-label="Service spotlight social post">
        <div class="service-top">
          <p class="kicker">What we care for</p>
          <h2>Stomach &amp; liver, under one warm roof.</h2>
        </div>
        <div class="service-grid">
          <div class="chip"><span class="dot gold"></span>Fatty liver</div>
          <div class="chip"><span class="dot burgundy"></span>Acid reflux</div>
          <div class="chip"><span class="dot caramel"></span>IBS support</div>
          <div class="chip"><span class="dot gold"></span>Screening</div>
        </div>
        <p class="brand-lock">Warm Care Clinic</p>
      </div>
      <figcaption>
        <strong>Service spotlight</strong>
        Soft cream field · chip accents in gold, burgundy, caramel
      </figcaption>
    </figure>
  </main>

  <footer>
    <p>Palette: Soft Cream #F6EFE4 · Soft Caramel #C9A87A · Smile Burgundy #6E2430 · Liver Gold #D4A53C</p>
  </footer>
</body>
</html>
